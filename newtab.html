<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笙维起始页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wallpaper-layer" id="wallpaperLayer"></div>
  <div class="search-focus-overlay" id="searchFocusOverlay"></div>
  <div class="container">
    <!-- 时间与日期 -->
    <div class="clock-section">
      <div class="time" id="clock">00:00:00</div>
      <div class="date" id="date">2026年7月28日 星期二</div>
      <div class="greeting" id="greeting">下午好</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-section">
      <form class="search-box" id="searchForm">
        <div class="engine-switcher" id="engineSwitcher">
          <button type="button" class="engine-switcher-trigger" id="engineTrigger">
            <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="engine-label" id="engineLabel">百度</span>
          </button>
          <div class="engine-switcher-dropdown" id="engineDropdown">
            <button type="button" class="engine-dropdown-item active" data-engine="baidu">百度</button>
            <button type="button" class="engine-dropdown-item" data-engine="google">Google</button>
            <button type="button" class="engine-dropdown-item" data-engine="bing">Bing</button>
            <button type="button" class="engine-dropdown-item" data-engine="duckduckgo">DuckDuckGo</button>
          </div>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="搜索或输入网址" autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
      </form>
    </div>

    <!-- 快捷导航 -->
    <div class="shortcuts-section">
      <div class="shortcuts-header">
        <span class="shortcuts-title">快捷导航</span>
        <button class="add-shortcut-btn" id="addShortcutBtn" title="添加快捷方式">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="shortcuts-grid" id="shortcutsGrid">
        <!-- 快捷方式由JS动态生成 -->
      </div>
    </div>

    <!-- 添加快捷方式的弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <h3 class="modal-title">添加快捷方式</h3>
        <div class="modal-field">
          <label>名称</label>
          <div class="modal-field-row">
            <input type="text" id="shortcutName" placeholder="例如：GitHub">
            <button type="button" class="fetch-title-btn" id="fetchTitleBtn" title="从网页获取标题">获取标题</button>
          </div>
        </div>
        <div class="modal-field">
          <label>网址</label>
          <input type="url" id="shortcutUrl" placeholder="https://github.com">
        </div>
        <div class="modal-field">
          <label>图标（可选）</label>
          <div class="modal-icon-row">
            <div class="modal-icon-preview" id="iconPreview">
              <span class="icon-letter" id="iconLetter">?</span>
            </div>
            <div class="modal-icon-actions">
              <button type="button" class="modal-btn icon-action-btn" id="fetchIconBtn" title="自动获取网站图标">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 9a3 3 0 015.12 1.5c0 1.5-3 2.5-3 2.5M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                获取图标
              </button>
              <input type="url" id="shortcutIconUrl" placeholder="或输入图标URL" class="icon-url-input">
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn cancel" id="modalCancel">取消</button>
          <button class="modal-btn confirm" id="modalConfirm">添加</button>
        </div>
      </div>
    </div>

    <!-- 壁纸设置面板 -->
    <div class="wallpaper-panel" id="wallpaperPanel">
      <div class="wallpaper-panel-header">
        <h3 class="wallpaper-panel-title">壁纸设置</h3>
        <button class="wallpaper-panel-close" id="wallpaperPanelClose">&times;</button>
      </div>
      <div class="wallpaper-panel-body">
        <div class="wallpaper-tabs">
          <button class="wallpaper-tab active" data-tab="bing">Bing 每日</button>
          <button class="wallpaper-tab" data-tab="custom">自定义</button>
          <button class="wallpaper-tab" data-tab="url">远程链接</button>
        </div>
        <div class="wallpaper-tab-content active" id="tabBing">
          <div class="auto-bing-daily">
            <label class="auto-bing-daily-label" for="autoBingDailyToggle">每日自动切换</label>
            <label class="toggle-switch">
              <input type="checkbox" id="autoBingDailyToggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="bing-loading" id="bingLoading">加载中...</div>
          <div class="bing-grid" id="bingGrid"></div>
        </div>
        <div class="wallpaper-tab-content" id="tabCustom">
          <div class="custom-upload-area" id="customUploadArea">
            <svg viewBox="0 0 24 24" width="32" height="32">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>点击或拖拽上传壁纸</span>
            <input type="file" id="customFileInput" accept="image/*" hidden>
          </div>
          <div class="custom-preview" id="customPreview"></div>
        </div>
        <div class="wallpaper-tab-content" id="tabUrl">
          <div class="url-field">
            <label>壁纸链接</label>
            <input type="url" id="wallpaperUrlInput" placeholder="https://example.com/wallpaper.jpg">
          </div>
          <button class="modal-btn confirm url-apply-btn" id="urlApplyBtn">应用</button>
          <div class="url-preview" id="urlPreview"></div>
        </div>
      </div>
      <div class="wallpaper-panel-footer">
        <button class="modal-btn cancel" id="wallpaperResetBtn">恢复默认</button>
      </div>
    </div>

    <!-- 壁纸设置按钮 -->
    <button class="wallpaper-settings-btn" id="wallpaperSettingsBtn" title="壁纸设置">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/>
        <path d="M21 15l-5-5L5 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- 设置按钮 -->
    <button class="general-settings-btn" id="generalSettingsBtn" title="设置">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" fill="none" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-panel-header">
        <h3 class="settings-panel-title">设置</h3>
        <button class="settings-panel-close" id="settingsPanelClose">&times;</button>
      </div>
      <div class="settings-panel-body">
        <!-- 时钟设置 -->
        <div class="settings-group">
          <div class="settings-group-title">时钟</div>
          <div class="settings-item">
            <span class="settings-label">24 小时制</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingClock24h" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-item">
            <span class="settings-label">显示秒数</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingClockSeconds" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-item">
            <span class="settings-label">显示日期</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingClockDate" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-item">
            <span class="settings-label">显示问候语</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingClockGreeting" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <!-- 搜索设置 -->
        <div class="settings-group">
          <div class="settings-group-title">搜索</div>
          <div class="settings-item">
            <span class="settings-label">默认搜索引擎</span>
            <select class="settings-select" id="settingSearchEngine">
              <option value="baidu">百度</option>
              <option value="google">Google</option>
              <option value="bing">Bing</option>
              <option value="duckduckgo">DuckDuckGo</option>
            </select>
          </div>
          <div class="settings-item">
            <span class="settings-label">聚焦模糊效果</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingSearchBlur" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <!-- 外观设置 -->
        <div class="settings-group">
          <div class="settings-group-title">外观</div>
          <div class="settings-item">
            <span class="settings-label">壁纸遮罩透明度</span>
            <div class="settings-slider-row">
              <input type="range" class="settings-range" id="settingWallpaperDim" min="0" max="100" value="55">
              <span class="settings-range-value" id="settingWallpaperDimValue">55%</span>
            </div>
          </div>
          <div class="settings-item">
            <span class="settings-label">显示快捷导航</span>
            <label class="toggle-switch">
              <input type="checkbox" id="settingShowShortcuts" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <!-- 数据管理 -->
        <div class="settings-group">
          <div class="settings-group-title">数据管理</div>
          <div class="settings-item">
            <span class="settings-label">导入 / 导出数据</span>
            <div class="settings-data-btns">
              <button class="settings-btn" id="exportDataBtn">导出</button>
              <button class="settings-btn" id="importDataBtn">导入</button>
              <input type="file" id="importFileInput" accept="application/json,.json" hidden>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 拖拽提示 -->
    <div class="drag-hint" id="dragHint">
      <svg viewBox="0 0 24 24" width="40" height="40">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-2h2v2zm0-4h-2V7h2v5z" fill="currentColor"/>
      </svg>
      <span>拖放链接到此处添加快捷方式</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
